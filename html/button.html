<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Collaborateurs - Chronométrage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>

<body>
    <div class="buttons-container">
        <div id="observation-info" class="observation-header">
        </div>
        <div id="chrono-display" class="chrono-section">
            <div class="chrono-display">00:00:00.00</div>
        </div>
        <div id="buttons-grid" class="buttons-grid">
        </div>
        <div class="end-session-container">
            <button id="endSessionBtn" class="end-session-button">Terminer la session</button>
        </div>
        <div class="add-task-container">
            <button id="addTaskBtn" class="add-task-button">Ajouter une nouvelle tâche</button>
        </div>
    </div>

    <div id="descriptionModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
        </div>
    </div>

    <div id="addTaskModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Ajouter une nouvelle tâche</h2>
            <form id="addTaskForm">
                <div class="form-group">
                    <label for="taskTitle">Titre de la tâche :</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description :</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskColor">Couleur :</label>
                    <input type="color" id="taskColor" value="#3498db">
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Ajouter</button>
                    <button type="button" class="cancel-btn">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/chrono.js"></script>
    <script src="../js/buttons.js"></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../js/service-worker.js');}</script>
    <script>
        document.getElementById('addTaskBtn').onclick = function(e) {
            e.preventDefault();
            const modal = document.getElementById('addTaskModal');
            modal.style.display = 'block';
            return false;
        };
    </script>
</body>
</html>
