<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Collaborateurs</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formulaire.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>

<body>
    <div class="form-container">
        <h1>Configuration du suivi du collaborateur</h1>
        <form id="taskForm">
            <div class="exam-info">
                <h2>Informations de l'observation</h2>
                <div class="info-grid">
                    <div class="form-group">
                        <label for="examineeName">Collaborateur observé :</label>
                        <input type="text" id="examineeName" name="examineeName" required
                            placeholder="Nom du collaborateur">
                    </div>

                    <div class="form-group">
                        <label for="examinerName">Observateur :</label>
                        <input type="text" id="examinerName" name="examinerName" required
                            placeholder="Nom de l'observateur">
                    </div>

                    <div class="form-group">
                        <label for="examDate">Date :</label>
                        <input type="date" id="examDate" name="examDate" required>
                    </div>
                </div>
            </div>

            <div class="section-divider"></div>
            <h2>Configuration des activités</h2>
            
            <div class="presets-section">
                <h3>Profils prédéfinis</h3>
                <p class="presets-hint">Chargez un ensemble de tâches prédéfinies selon le type d'activité :</p>
                <div class="presets-buttons">
                    <button type="button" class="preset-btn" data-preset="cariste">Cariste</button>
                    <button type="button" class="preset-btn" data-preset="assemblage">Assemblage</button>
                    <button type="button" class="preset-btn" data-preset="picking">Picking/Kitting</button>
                    <button type="button" class="preset-btn" data-preset="chafab">Chafab</button>
                </div>
            </div>

            <div class="section-divider"></div>
            <h3>Ajouter une tâche manuellement</h3>
            <div class="form-group">
                <label for="taskTitle">Nom de l'activité :</label>
                <input type="text" id="taskTitle" name="taskTitle" required>
            </div>

            <div class="form-group">
                <label for="taskDescription">Description de l'activité :</label>
                <textarea id="taskDescription" name="taskDescription" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="buttonColor">Couleur du bouton :</label>
                <div class="color-picker-container">
                    <input type="color" id="buttonColor" name="buttonColor" value="#4CAF50">
                </div>
            </div>

            <button type="submit" class="submit-button">Ajouter la tâche</button>
        </form>

        <div id="taskList">
            <h2>Liste des tâches configurées</h2>
            <div class="tasks-container">
            </div>
        </div>
        <div id="validationSection" class="validation-section">
            <button id="validateButton" type="button" class="validate-button">Valider et passer au
                chronométrage</button>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/formulaire.js"></script>
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../js/service-worker.js'); }</script>
</body>

</html>
