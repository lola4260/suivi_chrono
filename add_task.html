<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une tâche</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="formulaire.css">
</head>
<body>
    <div class="form-container">
        <h2>Ajouter une nouvelle tâche</h2>
        <form id="addTaskForm" class="task-form">
            <div class="form-group">
                <label for="taskTitle">Titre de la tâche :</label>
                <input type="text" id="taskTitle" required>
            </div>
            
            <div class="form-group">
                <label for="taskDescription">Description :</label>
                <textarea id="taskDescription" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label for="taskColor">Couleur du bouton :</label>
                <input type="color" id="taskColor" value="#3498db">
            </div>

            <div class="form-actions">
                <button type="submit" class="submit-button">Ajouter la tâche</button>
                <button type="button" id="cancelBtn" class="cancel-button">Annuler</button>
            </div>
        </form>
    </div>

    <script src="main.js"></script>
    <script src="add_task.js"></script>
</body>
</html>
